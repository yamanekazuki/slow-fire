name: SLOW FIRE 自動ブログ

# 週3回（月・水・金 朝7:00 JST）に記事を1本生成してコミットする。
# JST 07:00 = 前日 22:00 UTC。UTCの曜日 0(日)/2(火)/4(木) 22:00 が
# JSTの 月/水/金 07:00 にあたる。
on:
  schedule:
    - cron: "0 22 * * 0,2,4"
  workflow_dispatch:      # 手動実行（Actionsタブの Run workflow）
    inputs:
      force:
        description: "同じ日付の記事があっても強制生成する（テスト用）"
        type: boolean
        default: false

permissions:
  contents: write          # 生成物を main に push するため

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node 20 セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 記事生成
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_MODEL: claude-opus-4-8
          FORCE: ${{ github.event.inputs.force }}
        run: node scripts/generate-post.mjs

      - name: 変更をコミット & プッシュ
        run: |
          git config user.name  "slow-fire-bot"
          git config user.email "bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git add blog.html sitemap.xml blog/
          git commit -m "blog: 自動生成記事を追加 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git push

      # GitHub Pages の公開反映を待つ（メールのリンクが404にならないように）。
      # 記事URLが HTTP 200 を返すまで最大5分ポーリングする。
      - name: Pages公開を待機
        if: steps.gen.outputs.generated == 'true'
        run: |
          url="${{ steps.gen.outputs.url }}"
          echo "公開待ち: $url"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo 000)
            echo "  試行 $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "公開を確認しました。"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Pages反映の確認がタイムアウトしました（まもなく反映される見込み）。メールは送信します。"

      # 新しい記事が生成されたときだけ、関係者にメールで通知する
      - name: 記事公開メール通知
        if: steps.gen.outputs.generated == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: SLOW FIRE <${{ secrets.MAIL_USERNAME }}>
          to: yamane@potentialight.com,afroanri0126@gmail.com,woodyuetaku@gmail.com
          subject: "【SLOW FIRE】新しい読みものを公開しました：${{ steps.gen.outputs.title }}"
          html_body: |
            <div style="font-family:sans-serif;line-height:1.8;color:#222;max-width:600px">
              <p>SLOW FIRE の読みものに新しい記事を公開しました。</p>
              <p style="color:#c2410c;font-size:13px;letter-spacing:.05em">${{ steps.gen.outputs.category }}</p>
              <h2 style="margin:.2em 0 .6em">${{ steps.gen.outputs.title }}</h2>
              <p style="color:#555">${{ steps.gen.outputs.excerpt }}</p>
              <p style="margin-top:24px">
                <a href="${{ steps.gen.outputs.url }}"
                   style="display:inline-block;background:#c2410c;color:#fff;text-decoration:none;padding:12px 22px;border-radius:4px">
                  記事を読む
                </a>
              </p>
              <p style="font-size:13px;color:#888;margin-top:12px">${{ steps.gen.outputs.url }}</p>
              <hr style="border:none;border-top:1px solid #eee;margin:28px 0">
              <p style="font-size:12px;color:#aaa">SLOW FIRE — 火と時間が、食卓を変える。<br>このメールは記事の自動公開時に送信されています。</p>
            </div>
