name: SLOW FIRE SHOP 改善提案

# 週1・木曜5:00 JST（= 水曜20:00 UTC）に、レポート（前日の数値・流入・検索KW・人気ページ）と
# ショップ本体(EC・/journalは除外)のAI改善提案TOP3（承認不要で自動実装）を【1通に統合して】メールする。
# 旧・日次レポート単体便(daily-analytics.yml)は2026-07-05に本ワークフローへ統合済み。
# ブログ記事の改善は blog-improvement.yml（週1）が担当＝役割分担。
on:
  schedule:
    - cron: "0 20 * * 3"
  workflow_dispatch: {}   # 手動実行（テスト用）

permissions:
  contents: write   # act台帳(bbq-act-ledger.json)のコミット用
  actions: write    # actステージが同repo(slow-fire)のworkflowをdispatchするため

concurrency:
  group: shop-improvement
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 分析＋改善提案を生成
        id: gen
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SC_SITE_URL: "https://yamanekazuki.github.io/slow-fire-shop/"
          SITE_LABEL: "SLOW FIRE SHOP（EC）"
          SHOP_MODEL: claude-opus-4-8
          GA4_DASHBOARD_URL: ${{ secrets.GA4_DASHBOARD_URL }}
          # Phase 2：この2つが揃うとメールに［✅ 承認して実装する／却下］ボタンが出る
          APPROVAL_FN_BASE: ${{ secrets.APPROVAL_FN_BASE }}
          APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET }}
          # actステージ：打ち手のdispatch用トークン（クロスrepo=与論も叩くならPAT。無ければ同repoのみGITHUB_TOKENで発火）
          BBQ_DISPATCH_TOKEN: ${{ secrets.BBQ_DISPATCH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 与論島ガイドのGA4プロパティ（効果測定用・任意。未設定なら与論UUは未計測扱い＝CM-MEASURE-FIRST）
          YORON_GA4_PROPERTY_ID: ${{ secrets.YORON_GA4_PROPERTY_ID }}
        run: node scripts/shop-improvement.mjs

      - name: act台帳をコミット（変更があれば）
        if: always()
        run: |
          if [ -n "$(git status --porcelain bbq-act-ledger.json)" ]; then
            git config user.name "slowfire-bot"
            git config user.email "bot@slow-fire"
            git add bbq-act-ledger.json
            git commit -m "act: BBQ actステージ台帳を更新（週次）"
            git push
          else
            echo "台帳に変更なし"
          fi

      - name: メール配信（山根さん）
        if: steps.gen.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: SLOW FIRE SHOP <${{ secrets.MAIL_USERNAME }}>
          to: yamane@potentialight.com,afroanri0126@gmail.com,woodyuetaku@gmail.com
          subject: ${{ steps.gen.outputs.subject }}
          html_body: ${{ steps.gen.outputs.html }}
