<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程調整 | YORON BBQ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d95f3b'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 日程調整（2026-10-05 山根さん）: やまちゃんのGoogleカレンダーの空きを軸に、2週間分のマス目を各自がなぞって塗る。
   色は うえたく＝緑・あんちゃん＝赤・ヨッシー＝青。「みんなの重なり」は行ける人の色の帯、全員そろうと「全員OK」。
   マスを押すと下に「何月何日の何時〜何時」と、やまちゃん用の画面では「確定する」ボタン。
   計算は meet-logic.js、データの読み書きは Functions（meetPollGet / meetPollAnswer / meetCalendarSet / meetPollFix）だけ */
:root{--bg:#f6f1e4;--card:#fffdf6;--ink:#2d251c;--ink-soft:#8a8177;--ink2:#5b5044;--line:rgba(45,37,28,.14);--ember:#d95f3b;--ember-deep:#b74a2c;--navy:#2b3a4a;--sand:#efe8d6;--ok:#3d7a4a;--ok-bg:#e9f3ea;--warn:#9a6a12;--warn-bg:#fbf1dc;
  --c-uetaku:#3d8a4f;--c-anri:#d0453a;--c-yoshi:#2f6fc0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 110px}
.logo{font-weight:900;letter-spacing:.08em;color:var(--ember-deep);font-size:.95rem}
.logo small{font-size:.62rem;color:var(--ink-soft);letter-spacing:.18em;margin-left:.4em}
h1{font-size:1.55rem;font-weight:900;margin:10px 0 4px;line-height:1.35}
.lead{color:var(--ink2);font-size:.88rem}
.lead b{color:var(--ink)}
h2{font-size:1.15rem;font-weight:900;margin:26px 0 10px;line-height:1.4}
h2 small{font-size:.75rem;color:var(--ink-soft);font-weight:700;margin-left:.5em}
.box{background:var(--card);border-radius:16px;padding:14px;border:1.5px solid var(--line)}
.names{margin-top:14px}
.names .q{font-size:.85rem;font-weight:900;margin-bottom:6px}
.names .q span{font-size:.75rem;color:var(--ink-soft);font-weight:700;margin-left:.4em}
.names .bt{display:flex;gap:6px}
.names button{flex:1;border:2px solid var(--nc);background:var(--card);color:var(--nc);border-radius:12px;font:inherit;font-size:.88rem;font-weight:900;padding:.5rem .2rem;cursor:pointer;min-height:48px;white-space:nowrap;min-width:0}
.names button.on{background:var(--nc);color:#fff}
.names button.view{--nc:var(--ink-soft);flex:.75;font-size:.78rem}
@media(max-width:360px){.names button{font-size:.78rem}.names button.view{font-size:.7rem}}
.owner{display:inline-block;font-size:.72rem;font-weight:900;color:#fff;background:var(--navy);border-radius:100px;padding:2px 10px;margin-top:10px}
.tabs{display:flex;gap:6px;margin:16px 0 8px}
.tab{flex:1;padding:.55rem .4rem;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-weight:900;font-size:.86rem;cursor:pointer;color:var(--ink2);min-height:44px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint2{font-size:.8rem;color:var(--ink2);margin:4px 0 8px}
.wk{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.wk b{font-size:.95rem;font-weight:900}
.wk button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;font:inherit;font-weight:900;font-size:.82rem;padding:.4rem .8rem;cursor:pointer;min-height:40px;color:var(--ink)}
.wk button:disabled{opacity:.3}
/* マス目 */
.cal-grid{display:grid;background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;user-select:none;-webkit-user-select:none}
.cal-grid .hd{font-size:.7rem;font-weight:900;text-align:center;padding:6px 0;border-bottom:1.5px solid var(--line);background:var(--sand);line-height:1.2}
.cal-grid .hd small{display:block;font-size:.6rem;color:var(--ink-soft)}
.cal-grid .hd.wks,.cell.wks{border-left:2px solid rgba(45,37,28,.35)}
.cal-grid .tm{font-size:.6rem;color:var(--ink-soft);font-weight:700;text-align:right;height:28px;line-height:1;position:relative}
.cal-grid .tm span{position:absolute;right:4px;top:-5px;background:var(--card);padding:0 1px}
.cal-grid .tm.first span{top:2px}
.cal-grid .tm.end{height:12px}
.cal-grid .tm.end span{top:-5px}
.cell{height:28px;border-left:1px solid var(--line);border-top:1px solid rgba(45,37,28,.06);position:relative;cursor:pointer;display:flex;align-items:stretch;justify-content:center;gap:2px;padding:2px}
.cell.hr{border-top:1px solid var(--line)}
.cell.tail{height:12px;cursor:default;border-top:1px solid var(--line);padding:0}
.cal-grid.paint .cell{touch-action:none} /* 塗る画面だけ指でなぞれる。見るだけの画面はマスの上でもスクロールできる */
.cell.x{background:repeating-linear-gradient(135deg,#ebe5d6 0 4px,#f6f1e4 4px 8px);cursor:not-allowed}
.cell.none{background:transparent;cursor:default}
.cell.cb:not(.pick):not(.x)::after{content:'予定';color:var(--warn);font-size:.52rem;font-weight:900;align-self:center}
.cell i{flex:1;border-radius:3px;display:block;max-width:12px}
.cell.allok{background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--ok)}
.cell.sel{box-shadow:inset 0 0 0 2.5px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.74rem;font-weight:700;color:var(--ink2);margin:8px 0 0}
.legend i{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
/* 押したマスの日時・確定 */
.pick-panel{margin-top:12px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px}
.pick-panel .when{font-size:1.25rem;font-weight:900;line-height:1.4}
.pick-panel ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px 12px;margin:8px 0;font-size:.84rem;font-weight:700}
.pick-panel li .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.pick-panel li.no{color:var(--ink-soft);text-decoration:line-through}
.pick-panel .note{font-size:.8rem;color:var(--ink2)}
.btn{border:0;background:var(--ink);color:#fff;border-radius:12px;font:inherit;font-size:.95rem;font-weight:900;padding:.7rem 1.1rem;cursor:pointer;min-height:48px;white-space:nowrap}
.btn.go{background:var(--ember);width:100%;margin-top:6px}
.btn.go:disabled{opacity:.5}
.btn.sub{background:#fff;color:var(--ink2);border:1.5px solid var(--line);font-size:.85rem;min-height:44px}
.mine-list{margin-top:12px}
.upd-row{margin-top:12px}
.btn.upd{width:100%;background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.upd.go2{background:var(--ember);color:#fff;border-color:var(--ember)}
.btn.upd:disabled{opacity:.6}
.upd-m{font-size:.8rem;font-weight:700;color:var(--ink2);margin-top:6px}
.upd-m.dirty{color:var(--ember-deep);font-weight:900}
.hint-row{display:flex;align-items:center;gap:8px}
.hint-row .hint2{flex:1}
.btn.small{min-height:38px;padding:.35rem .8rem;font-size:.8rem}
.row .fix{border:0;background:var(--ember);color:#fff;border-radius:10px;padding:.5rem .8rem;font:inherit;font-weight:900;font-size:.85rem;cursor:pointer;min-height:44px;white-space:nowrap}
.back{display:inline-block;font-size:.8rem;font-weight:900;color:var(--ember-deep);text-decoration:none;margin-top:6px}
.s-list{display:flex;flex-direction:column;gap:8px}
.s-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.s-d{font-size:1.05rem;font-weight:900}
.s-st{display:block;font-size:.78rem;font-weight:700;color:var(--ember-deep)}
.s-st.ok{color:var(--ok)}
.s-item .btn{width:auto;margin:0;font-size:.85rem;min-height:44px;padding:.5rem .9rem;text-decoration:none;display:inline-flex;align-items:center}
.done-card .zt{font-size:.85rem;color:var(--ink);font-weight:700}
.mine-list h3{font-size:1rem;font-weight:900;margin-bottom:6px}
.mine-list ul{margin-left:1.2em;font-size:.88rem;font-weight:700}
.mine-list p{font-size:.84rem;color:var(--ink2)}
/* 全員OKの一覧 */
.prog{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;font-weight:700;color:var(--ink2);margin-top:14px}
.prog .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.best .none{font-size:.85rem;color:var(--ink2)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;background:var(--ok-bg);border:1.5px solid rgba(61,122,74,.45);border-radius:12px;padding:8px 12px;margin-bottom:6px;min-height:52px;color:var(--ink)}
.row.near{background:var(--card);border-color:var(--line)}
.row .t{font-weight:900;font-size:.95rem}
.row .nm{font-size:.74rem;font-weight:700;color:var(--ink2)}
.row .go-s{font-size:.78rem;font-weight:900;color:var(--ember-deep)}
/* カレンダー連携 */
.cal{margin-top:16px}
.cal .st{font-size:.85rem;font-weight:700}
.cal .st b.ok{color:var(--ok)}
.cal .st b.ng{color:var(--warn)}
.cal details{margin-top:8px}
.cal summary{cursor:pointer;font-weight:900;font-size:.85rem;color:var(--ember-deep)}
.cal ol{margin:8px 0 8px 1.3em;font-size:.84rem;color:var(--ink2)}
.cal .note{font-size:.76rem;color:var(--ink-soft);margin:6px 0}
.cal .f{display:flex;gap:6px;margin-top:6px}
.cal input{flex:1;min-width:0;font:inherit;font-size:.85rem;border:1.5px solid var(--line);border-radius:10px;padding:.55rem .7rem;background:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{font-size:.8rem;font-weight:700;margin-top:6px;min-height:1.3em;color:var(--ink2)}
.msg.err{color:#b23a2a}
/* あなたは誰？ */
.modal{position:fixed;inset:0;background:rgba(45,37,28,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .in{background:var(--card);border-radius:20px;padding:22px 18px;width:100%;max-width:360px;text-align:center}
.modal h2{margin:0 0 6px}
.modal p{font-size:.85rem;color:var(--ink2);margin-bottom:14px}
.modal button{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:14px;color:#fff;font:inherit;font-size:1.1rem;font-weight:900;padding:.85rem;margin-top:8px;cursor:pointer;min-height:54px}
.modal .later{background:none;color:var(--ink-soft);font-size:.82rem;min-height:40px;margin-top:4px}
.done-card{background:var(--card);border:2px solid var(--ok);border-radius:18px;padding:20px 16px;margin-top:18px;text-align:center}
.done-card .k{font-size:.72rem;letter-spacing:.2em;color:var(--ok);font-weight:900}
.done-card .when{font-size:1.5rem;font-weight:900;margin:6px 0 12px}
.done-card a.btn{display:inline-block;text-decoration:none;background:var(--ok)}
.done-card p{font-size:.82rem;color:var(--ink2);margin-top:10px}
.save{position:fixed;left:0;right:0;bottom:0;background:rgba(246,241,228,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px);font-size:.8rem;font-weight:700;color:var(--ink2);z-index:10}
.save .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.save .bar-t{flex:1;line-height:1.4}
.save .bar-t.dirty{color:var(--ember-deep);font-weight:900}
.save .upd{background:#fff;color:var(--ink);border:1.5px solid var(--line);min-height:44px;padding:.5rem 1rem;font-size:.9rem}
.save .upd.go2{background:var(--ember);color:#fff;border-color:var(--ember)}
.save .upd:disabled{opacity:.6}
.loading,.error{padding:40px 0;text-align:center;color:var(--ink2);font-weight:700}
.error{color:#b23a2a}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">YORON BBQ<small>日程調整</small></div>
  <div id="app"><div class="loading">やまちゃんのカレンダーを読んでいます…</div></div>
</div>
<div id="modalRoot"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="meet-logic.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var ID = qs.get('p') || '';
  var KEY = qs.get('k') || '';
  var app = document.getElementById('app');
  var COLORS = { uetaku: 'var(--c-uetaku)', anri: 'var(--c-anri)', yoshi: 'var(--c-yoshi)' };
  var S = { data: null, me: '', mine: null, saving: false, pending: null, page: null, sel: '' };

  function call(name, payload) {
    var fns = (typeof sfFunctions !== 'undefined' && sfFunctions) || firebase.app().functions('asia-northeast1');
    return fns.httpsCallable(name)(Object.assign({ id: ID }, payload || {})).then(function (r) { return r.data; });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function errText(e) { return (e && e.message) ? e.message.replace(/^.*?:\s*/, '') : '通信できませんでした'; }
  function color(key) { return COLORS[key] || 'var(--ok)'; }
  function name(key) { var d = S.data; if (key === d.owner.key) return d.owner.name; var m = d.members.filter(function (x) { return x.key === key; })[0]; return m ? m.name : key; }

  function load() {
    if (!ID) return loadSeries(); // URLに日程調整の指定がなければ、トップ（どの回を動かすか）
    return call('meetPollGet', { k: KEY }).then(function (d) {
      S.data = d; S.mine = null; S.grid = null;
      if (S.me && !d.members.some(function (m) { return m.key === S.me; })) S.me = '';
      if (d.isAdmin) S.me = ''; // やまちゃん用の画面では、前に選んだ名前で回答しない
      if (S.me) initMine();
      render();
      askWho();
      bar();
    }).catch(function (e) {
      if (S.saving) throw e; // 「更新する」の途中なら、呼び出し側で案内する（画面は残す）
      app.innerHTML = '<div class="error">' + esc(errText(e)) + '</div>';
    });
  }

  // 自分の塗りの初期値: 反映済みならその値。まだで、カレンダーをつないでいれば空いている時間を塗っておく（反映は「更新する」で）
  function initMine() {
    var d = S.data, a = d.answers[S.me];
    var fill = S.forceFill; S.forceFill = false;
    S.dirty = false;
    if (a && a.updatedAt && !fill) { S.mine = (a.ok || []).slice(); return; }
    if (d.calendars[S.me] && d.calendars[S.me].ok) {
      S.mine = MeetLogic.prefillFromBusy(d.cells, d.memberBusy[S.me]);
      S.dirty = S.mine.length > 0;
      return;
    }
    S.mine = [];
  }

  // 塗っただけでは保存しない。「〇〇が行ける時間」の下の「更新する」で反映し、みんなの最新も読み直す
  // （2026-10-05 山根さん「更新するは自分の部分を更新する意味なので、行ける時間の下に」）
  function queueSave() { S.dirty = true; S.updMsg = ''; renderBelow(); }
  function bar() {} // 下の帯は廃止（ボタンは各欄に）
  function update() {
    if (S.saving) return;
    var job = (S.dirty && S.me) ? { member: S.me, ok: S.mine.slice() } : null;
    S.saving = true; renderBelow();
    var saved = false;
    (job ? call('meetPollAnswer', job) : Promise.resolve()).then(function () {
      saved = true; S.dirty = false;
      return load();
    }).then(function () {
      S.saving = false; S.updMsg = job ? '反映しました。みんなの最新も読み込みました' : 'みんなの最新を読み込みました'; renderBelow();
    }).catch(function (e) {
      S.saving = false;
      S.updMsg = saved && job ? '反映はできました。最新の読み込みに失敗したので、ページを開き直してください' : '反映できませんでした：' + errText(e);
      renderBelow();
    });
  }
  function confirmDiscard() {
    return !S.dirty || confirm('まだ反映していない塗りがあります。反映せずに切り替えますか？\n（反映するときは、先に下の「更新する」を押してください）');
  }

  // ---- あなたは誰？（最初にポップアップ） ----
  function askWho() {
    var root = document.getElementById('modalRoot');
    var d = S.data;
    if (!d || d.isAdmin || S.me || d.status === 'fixed' || S.skipAsk) { root.innerHTML = ''; return; }
    root.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="in"><h2>あなたは誰ですか？</h2><p>押すと、自分の行ける時間を塗れるようになります。</p>' +
      d.members.map(function (m) { return '<button data-who="' + esc(m.key) + '" style="background:' + color(m.key) + '">' + esc(m.name) + '</button>'; }).join('') +
      '<button class="later" data-who="">見るだけ</button></div></div>';
  }
  document.getElementById('modalRoot').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-who]'); if (!b) return;
    if (b.dataset.who) choose(b.dataset.who); else { S.skipAsk = true; askWho(); bar(); }
  });
  function choose(key) {
    S.me = key; S.view = 'me'; S.sel = '';
    initMine(); render(); askWho(); bar();
  }

  // ---- いまの状態から計算 ----
  function rowsNow() { return MeetLogic.recount(S.data.rows, S.data.members, S.data.answers, S.me, S.mine, S.data.durationMin); }
  function okSets() {
    var d = S.data, out = {};
    d.members.forEach(function (m) {
      var ok = (m.key === S.me && S.mine) ? S.mine : ((d.answers[m.key] && d.answers[m.key].ok) || []);
      var s = {}; ok.forEach(function (id) { s[id] = 1; }); out[m.key] = s;
    });
    return out;
  }
  function view() { return (!S.data || S.data.isAdmin || !S.me) ? 'all' : (S.view || 'me'); } // トップ（S.data なし）では塗らない

  // ---- マス目（2週間ずつ） ----
  function gridHtml() {
    var d = S.data, g = S.grid, pages = MeetLogic.pages(g, 2), pg = pages[S.page] || { days: [], weekStart: {} }, days = pg.days, v = view();
    var sets = okSets();
    var mine = {}; (S.mine || []).forEach(function (id) { mine[id] = 1; });
    var cb = {}; ((S.me && d.memberBusy[S.me]) || []).forEach(function (id) { cb[id] = 1; });
    var selIds = {};
    if (S.sel) MeetLogic.slotCellIds({ start: S.sel }, d.durationMin).forEach(function (id) { selIds[id] = 1; });
    var h = '<div class="cal-grid' + (v === 'me' ? ' paint' : '') + '" id="grid" style="grid-template-columns:34px repeat(' + days.length + ',minmax(0,1fr))"><div class="hd"></div>';
    days.forEach(function (day, di) {
      var l = MeetLogic.dayLabel(day);
      h += '<div class="hd' + (pg.weekStart[di] ? ' wks' : '') + '">' + esc(l.replace(/\(.\)$/, '')) + '<small>' + esc(l.slice(-2, -1)) + '</small></div>';
    });
    g.times.forEach(function (t, ti) {
      var hr = /:00$/.test(t);
      h += '<div class="tm' + (ti === 0 ? ' first' : '') + '">' + (hr || ti === 0 ? '<span>' + esc(t) + '</span>' : '') + '</div>';
      days.forEach(function (day, di) {
        var c = g.at(day, t), cls = 'cell' + (hr ? ' hr' : '') + (pg.weekStart[di] ? ' wks' : ''), inner = '';
        if (!c) cls += ' none';
        else if (c.busy) cls += ' x';
        else if (v === 'me') {
          if (cb[c.id]) cls += ' cb';
          if (mine[c.id]) { cls += ' pick'; inner = '<i style="background:' + color(S.me) + ';max-width:none"></i>'; }
        } else {
          var who = d.members.filter(function (m) { return sets[m.key][c.id]; });
          inner = who.map(function (m) { return '<i style="background:' + color(m.key) + '"></i>'; }).join('');
          if (who.length === d.members.length) cls += ' allok';
        }
        if (c && selIds[c.id]) cls += ' sel';
        h += '<div class="' + cls + '"' + (c ? ' data-c="' + esc(c.id) + '" data-d="' + di + '" data-t="' + ti + '"' : '') + '>' + inner + '</div>';
      });
    });
    // 一番下の目盛り（17:00 など、時間帯の終わり）
    h += '<div class="tm end"><span>' + esc(d.winEnd) + '</span></div>';
    days.forEach(function (day, di) { h += '<div class="cell tail' + (pg.weekStart[di] ? ' wks' : '') + '"></div>'; });
    h += '</div>';
    var hatch = '<span><i style="background:repeating-linear-gradient(135deg,#ebe5d6 0 3px,#f6f1e4 3px 6px)"></i>やまちゃんが埋まっている</span>';
    var legend = v === 'me'
      ? '<div class="legend"><span><i style="background:' + color(S.me) + '"></i>' + esc(name(S.me)) + 'が行ける</span>' + hatch + '</div>'
      : '<div class="legend">' + d.members.map(function (m) { return '<span><i style="background:' + color(m.key) + '"></i>' + esc(m.name) + '</span>'; }).join('') +
        '<span><i style="background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--ok)"></i>全員OK</span>' + hatch + '</div>';
    var nav = pages.length > 1 ? '<div class="wk"><button data-pg="-1"' + (S.page <= 0 ? ' disabled' : '') + '>‹ 前の2週間</button><b>' +
      esc(MeetLogic.dayLabel(days[0]).replace(/\(.\)$/, '') + '〜' + MeetLogic.dayLabel(days[days.length - 1]).replace(/\(.\)$/, '')) +
      '</b><button data-pg="1"' + (S.page >= pages.length - 1 ? ' disabled' : '') + '>次の2週間 ›</button></div>' : '';
    return nav + h + legend;
  }
  function renderGrid() { var el = document.getElementById('gridWrap'); if (el) el.innerHTML = gridHtml(); }

  // ---- 下の欄: 押したマスの日時と確定／自分が塗った時間／全員OKの時間 ----
  function selHtml() {
    var d = S.data;
    if (!S.sel) return '';
    var row = rowsNow().filter(function (r) { return r.id === S.sel; })[0];
    if (!row) return '<div class="pick-panel"><div class="note">ここからは' + d.durationMin + '分とれません（やまちゃんの予定か、時間帯の終わりにかかります）。別のマスを押してください。</div></div>';
    var list = '<li><span class="dot" style="background:var(--navy)"></span>' + esc(d.owner.name) + '</li>' +
      d.members.map(function (m) { var ok = row.okBy.indexOf(m.key) >= 0; return '<li class="' + (ok ? '' : 'no') + '"><span class="dot" style="background:' + color(m.key) + '"></span>' + esc(m.name) + '</li>'; }).join('');
    var all = row.allOk;
    var act = d.isAdmin
      ? '<button class="btn go" data-fix="' + esc(row.id) + '">この日時で確定する</button>' + (all ? '' : '<p class="note" style="margin-top:6px">まだ全員そろっていません。押すと、そろっていなくても確定します。</p>')
      : (all && S.me && !S.dirty ? '<button class="btn go" data-fix="' + esc(row.id) + '">この日時で確定する</button>'
         : '<p class="note">' + (all ? (S.me ? '全員そろっています。先に「更新する」で反映すると確定できます。' : '全員そろっています。自分の名前を選ぶと確定できます。') : '取り消し線の人が、まだこの時間を塗っていません。') + '</p>');
    return '<div class="pick-panel"><div class="when">' + esc(row.label) + '</div><ul>' + list + '</ul>' + act + '</div>';
  }
  function updHtml(label) {
    var cls = 'btn upd' + (S.dirty ? ' go2' : '');
    var msg = S.dirty ? '<p class="upd-m dirty">まだみんなに反映されていません。「更新する」を押してください</p>' : (S.updMsg ? '<p class="upd-m">' + esc(S.updMsg) + '</p>' : '');
    return '<div class="upd-row"><button class="' + cls + '" id="updBtn"' + (S.saving ? ' disabled' : '') + '>' + (S.saving ? '反映しています…' : esc(label || '更新する')) + '</button>' + msg + '</div>';
  }
  function mineHtml() {
    if (view() !== 'me') return '';
    var r = MeetLogic.ranges(S.mine || []);
    return '<div class="mine-list box"><h3>' + esc(name(S.me)) + 'が行ける時間</h3>' +
      (r.length ? '<ul>' + r.map(function (x) { return '<li>' + esc(x.label) + '</li>'; }).join('') + '</ul>' : '<p>まだ塗っていません。上のマス目をなぞってください。</p>') +
      updHtml() + '</div>';
  }
  function bestHtml() {
    var d = S.data, rows = rowsNow();
    var prog = d.members.map(function (m) {
      var done = (m.key === S.me) ? !!(S.mine && S.mine.length) || !!(d.answers[m.key] && d.answers[m.key].updatedAt) : !!(d.answers[m.key] && d.answers[m.key].updatedAt);
      return '<span><span class="dot" style="background:' + (done ? color(m.key) : 'var(--line)') + '"></span>' + esc(m.name) + (done ? ' 回答済み' : ' まだ') + '</span>';
    }).join('');
    // 「あと1人で全員そろう時間」は出さない（2026-10-05 山根さん「いらない」）。全員OKだけ
    var best = { rows: rows.filter(function (r) { return r.allOk; }).slice(0, 8) };
    var head = '全員OKの時間';
    var body = best.rows.length ? best.rows.map(function (r) {
      var canFix = d.isAdmin || (S.me && !S.dirty);
      return '<div class="row"><span><span class="t">' + esc(r.label) + '</span><br><span class="nm">全員OK</span></span>' +
        (canFix ? '<button class="fix" data-fix="' + esc(r.id) + '">この日時で確定する</button>' : '') + '</div>';
    }).join('') + (S.me && S.dirty ? '<p class="none">確定するには、先に「更新する」で自分の塗りを反映してください。</p>' : '<p class="none">最後にそろった人が「この日時で確定する」を押してください。やまちゃんのカレンダーに入り、運営LINEにZoomのURLつきで流れます。</p>')
      : '<p class="none">まだありません。みんなの塗ったところが' + d.durationMin + '分続けて重なると、ここに出ます。</p>';
    return '<div class="prog">' + prog + '</div><h2>' + head + (best.rows.length ? '<small>' + best.rows.length + '件</small>' : '') + '</h2><div class="best">' + body + '</div>';
  }
  function calHtml() {
    if (!S.me) return '';
    var d = S.data, c = d.calendars[S.me];
    var st = !c ? 'カレンダー：<b>つないでいません</b>（つなぐと、空いている時間が最初から塗られます）'
      : c.ok ? 'カレンダー：<b class="ok">つないであります</b>（自分の予定があるマスに「予定」と出ます）'
      : 'カレンダー：<b class="ng">' + esc(c.error) + '</b>';
    return '<div class="box cal"><div class="st">' + st + '</div>' +
      (c && c.ok ? '<div class="acts"><button class="btn sub" id="refill">カレンダーの空きで塗り直す</button><button class="btn sub" id="calOff">カレンダーを外す</button></div>' : '') +
      '<details><summary>' + (c ? 'URLを貼り直す' : 'カレンダーをつなぐ（任意・1回だけ）') + '</summary>' +
      '<ol><li>パソコンでGoogleカレンダーを開き、右上の歯車から「設定」を開く</li>' +
      '<li>左の「マイカレンダーの設定」で自分のカレンダーを選ぶ</li>' +
      '<li>「カレンダーの統合」にある「iCal形式の非公開URL」をコピーする</li>' +
      '<li>下に貼って「つなぐ」を押す</li></ol>' +
      '<p class="note">使うのは「その時間に予定があるかどうか」だけです。予定の名前や中身は保存も表示もしません。iPhoneのカレンダー・Outlookの共有URLも貼れます。</p>' +
      '<div class="f"><input id="icsUrl" type="url" inputmode="url" placeholder="https://calendar.google.com/calendar/ical/…/basic.ics" autocomplete="off"><button class="btn" id="calSave">つなぐ</button></div>' +
      '<div class="msg" id="calMsg"></div></details></div>';
  }
  function renderBelow() { var el = document.getElementById('below'); if (el) el.innerHTML = selHtml() + mineHtml() + bestHtml() + calHtml(); }

  function render() {
    var d = S.data;
    var lead = '<p class="lead">' + (d.note ? esc(d.note) + '<br>' : '') + '<b>' + d.durationMin + '分</b>のミーティングです。やまちゃんの予定を軸に、<b>' + esc(d.winStart) + '〜' + esc(d.winEnd) + '</b> の中で決めます。</p>';
    if (d.status === 'fixed' && d.fixed) {
      app.innerHTML = '<h1>' + esc(d.title) + '</h1>' + lead +
        '<div class="done-card"><div class="k">決まりました</div><div class="when">' + esc(d.fixed.label) + '</div>' +
        '<p>ZoomのURLは運営LINEに流しました。やまちゃんのカレンダーにも入っています。</p></div>';
      bar();
      return;
    }
    S.grid = S.grid || MeetLogic.grid(d.cells);
    if (S.page == null) {
      // 最初は、塗れるマスがある最初の2週間
      var pages = MeetLogic.pages(S.grid, 2); S.page = 0;
      for (var i = 0; i < pages.length; i++) { if (d.cells.some(function (c) { return !c.busy && pages[i].days.indexOf(c.day) >= 0; })) { S.page = i; break; } }
    }
    // 名前は常に3人分並べる（2026-10-05 山根さん「切り替えるボタンは分かりにくい。みんなの名前があった方がいい」）
    var head = d.isAdmin
      ? '<span class="owner">やまちゃん用の画面（マスを押すと、その日時で確定できます）</span>'
      : '<div class="names"><div class="q">あなたは？<span>' + (S.me ? esc(name(S.me)) + 'として塗っています' : '自分の名前を押すと塗れます') + '</span></div><div class="bt">' +
        d.members.map(function (m) { return '<button class="' + (S.me === m.key ? 'on' : '') + '" data-who2="' + esc(m.key) + '" style="--nc:' + color(m.key) + '" aria-pressed="' + (S.me === m.key) + '">' + esc(m.name) + '</button>'; }).join('') +
        '<button class="view' + (S.me ? '' : ' on') + '" data-who2="">見るだけ</button></div></div>';
    var v = view();
    var tabs = (!d.isAdmin && S.me) ? '<div class="tabs"><button class="tab' + (v === 'me' ? ' on' : '') + '" data-view="me">自分の空きを塗る</button><button class="tab' + (v === 'all' ? ' on' : '') + '" data-view="all">みんなの重なり</button></div>' : '';
    var hint = v === 'me'
      ? '<p class="hint2">行ける時間を<b>指でなぞって</b>塗ってください。塗ったところをなぞると消えます。塗り終わったら、下の<b>「更新する」</b>で反映されます。</p>'
      : '<div class="hint-row"><p class="hint2">色の帯が、その時間に行ける人です。マスを押すと、下にその日時が出ます。</p><button class="btn sub small" id="updBtn">最新にする</button></div>';
    app.innerHTML = '<a class="back" href="./meet.html">‹ 定例の一覧へ</a><h1>' + esc(d.title) + '</h1>' + lead + head + tabs + hint +
      '<div id="gridWrap">' + gridHtml() + '</div><div id="below">' + selHtml() + mineHtml() + bestHtml() + calHtml() + '</div>';
  }

  // ---- なぞって塗る（ドラッグで長方形の範囲。始めたマスが塗ってあれば消す・なければ塗る） ----
  var drag = null;
  function cellAt(x, y) { var el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.cell[data-c]') : null; }
  function curDays() { return MeetLogic.pages(S.grid, 2)[S.page].days; }
  function applyPreview() {
    var ids = MeetLogic.rectIds(S.grid, curDays(), drag.a, drag.b);
    drag.next = MeetLogic.paint(drag.base, ids, drag.add);
    var on = {}; drag.next.forEach(function (id) { on[id] = 1; });
    Array.prototype.forEach.call(document.querySelectorAll('#grid .cell[data-c]'), function (el) {
      if (el.classList.contains('x')) return;
      var has = !!on[el.dataset.c];
      el.classList.toggle('pick', has);
      el.innerHTML = has ? '<i style="background:' + color(S.me) + ';max-width:none"></i>' : '';
    });
  }
  app.addEventListener('pointerdown', function (ev) {
    if (view() !== 'me') return;
    var el = ev.target.closest && ev.target.closest('.cell[data-c]');
    if (!el || el.classList.contains('x') || drag || S.saving) return; // 2本目の指では始め直さない・反映中は塗らない（読み直しで消えるため）
    ev.preventDefault();
    try { el.setPointerCapture(ev.pointerId); } catch (e) {} // 窓の外で離しても終わりが届くように
    var pos = { d: +el.dataset.d, t: +el.dataset.t };
    drag = { pid: ev.pointerId, a: pos, b: pos, base: S.mine.slice(), add: S.mine.indexOf(el.dataset.c) < 0 };
    applyPreview();
  });
  window.addEventListener('pointermove', function (ev) {
    if (!drag || ev.pointerId !== drag.pid) return; // 2本目の指は無視
    if (ev.pointerType === 'mouse' && ev.buttons === 0) return endDrag(); // ボタンを離した後に戻ってきた
    var el = cellAt(ev.clientX, ev.clientY);
    if (!el) return;
    var pos = { d: +el.dataset.d, t: +el.dataset.t };
    if (pos.d === drag.b.d && pos.t === drag.b.t) return;
    drag.b = pos; applyPreview();
  });
  function endDrag(ev) {
    if (!drag || (ev && ev.pointerId != null && ev.pointerId !== drag.pid)) return;
    S.mine = drag.next || drag.base; drag = null;
    queueSave(); renderGrid(); renderBelow();
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  app.addEventListener('click', function (ev) {
    // 見る画面: マスを押すと、そこから会議の長さ分の日時を下に出す
    var cell = ev.target.closest && ev.target.closest('.cell[data-c]');
    if (cell && view() === 'all' && !cell.classList.contains('x')) {
      S.sel = cell.dataset.c; renderGrid(); renderBelow();
      var p = document.querySelector('.pick-panel'); if (p && p.scrollIntoView) p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return;
    }
    var t = ev.target.closest('button'); if (!t) return;
    if (t.dataset.who2 != null) {
      if (t.dataset.who2 === S.me) return;
      if (!confirmDiscard()) return; // 反映していない塗りを、次の人の名前で保存することはない
      if (t.dataset.who2) { choose(t.dataset.who2); return; }
      S.me = ''; S.skipAsk = true; S.view = 'all'; S.dirty = false;
      render(); bar(); return;
    }
    if (t.id === 'updBtn') { update(); return; }
    if (t.dataset.view) { S.view = t.dataset.view; render(); return; }
    if (t.dataset.pg) { S.page = Math.max(0, S.page + Number(t.dataset.pg)); renderGrid(); return; }
    if (t.dataset.sel) {
      S.sel = t.dataset.sel; if (!S.data.isAdmin && S.me) S.view = 'all';
      render();
      var p2 = document.querySelector('.pick-panel'); if (p2 && p2.scrollIntoView) p2.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (t.dataset.fix) {
      var r = S.data.rows.filter(function (x) { return x.id === t.dataset.fix; })[0];
      if (!confirm((r ? r.label : '') + ' で確定します。\nやまちゃんのカレンダーに入れて、運営LINEにZoomのURLつきで流します。')) return;
      t.disabled = true; t.textContent = '確定しています…';
      call('meetPollFix', { k: KEY, slot: t.dataset.fix, member: S.me || '' }).then(function () { return load(); })
        .catch(function (e) { alert(errText(e)); t.disabled = false; t.textContent = 'この日時で確定する'; });
      return;
    }
    if (t.id === 'calSave') {
      var url = document.getElementById('icsUrl').value.trim(), msg = document.getElementById('calMsg');
      if (!url) { msg.className = 'msg err'; msg.textContent = 'URLを貼ってください'; return; }
      t.disabled = true; msg.className = 'msg'; msg.textContent = 'カレンダーを読んでいます…';
      call('meetCalendarSet', { member: S.me, icsUrl: url }).then(function () {
        S.forceFill = true; // つないだ直後は、回答済みでもカレンダーの空きで塗り直す
        return load();
      }).catch(function (e) { t.disabled = false; msg.className = 'msg err'; msg.textContent = errText(e); });
      return;
    }
    if (t.id === 'calOff') {
      if (!confirm('カレンダーを外します。塗ったところはそのまま残ります。')) return;
      call('meetCalendarSet', { member: S.me, remove: true }).then(load).catch(function (e) { alert(errText(e)); });
      return;
    }
    if (t.id === 'refill') {
      S.mine = MeetLogic.prefillFromBusy(S.data.cells, S.data.memberBusy[S.me]);
      queueSave(); renderGrid(); renderBelow(); return;
    }
  });

  // ---- トップ: やまちゃんのカレンダーから定例の回を並べ、「この回を動かしたい」で日程調整を作る（2026-10-05 山根さん） ----
  var SER = null;
  function loadSeries() {
    return call('meetSeriesGet', {}).then(function (d) { SER = d; renderSeries(); })
      .catch(function (e) { app.innerHTML = '<div class="error">' + esc(errText(e)) + '</div>'; });
  }
  function renderSeries() {
    var d = SER, first = d.items[0];
    var when = first ? first.label.replace(/^\S+\s/, '') : '';
    var list = d.items.length ? d.items.map(function (it) {
      var p = it.poll, right, sub = '';
      if (!p) right = '<button class="btn go s-req" data-req="' + esc(it.date) + '">この回を動かしたい</button>';
      else if (p.status === 'fixed') { sub = '<span class="s-st ok">決まりました：' + esc(p.fixedLabel) + '</span>'; right = '<a class="btn sub s-open" href="?p=' + esc(p.id) + '">開く</a>'; }
      else { sub = '<span class="s-st">日程調整中' + (p.requestedBy ? '（' + esc(nameOf(p.requestedBy)) + 'が依頼）' : '') + '</span>'; right = '<a class="btn go s-open" href="?p=' + esc(p.id) + '">開いて塗る</a>'; }
      return '<div class="s-item"><div><div class="s-d">' + esc(it.label) + '</div>' + sub + '</div>' + right + '</div>';
    }).join('') : '<p class="lead">これから先の定例が、やまちゃんのカレンダーに見つかりませんでした。</p>';
    app.innerHTML = '<h1>' + esc(d.title) + 'の日程調整</h1>' +
      '<p class="lead">いつもは<b>毎週' + esc(first ? first.label.match(/\((.)\)/)[1] + '曜 ' + when : '') + '</b>の定例です。動かしたい回の「この回を動かしたい」を押してください。<br>やまちゃんのGoogleカレンダーとつながっているので、誰が依頼しても、やまちゃんの空いている時間で調整できます。</p>' +
      '<h2>これからの定例</h2><div class="s-list">' + list + '</div>';
  }
  function nameOf(key) {
    if (SER && key === SER.owner.key) return SER.owner.name;
    var m = SER && SER.members.filter(function (x) { return x.key === key; })[0]; return m ? m.name : key;
  }
  function askRequester(date) {
    var it = SER.items.filter(function (x) { return x.date === date; })[0];
    var people = [SER.owner].concat(SER.members);
    var root = document.getElementById('modalRoot');
    root.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="in"><h2>誰が依頼しますか？</h2><p>' + esc(it.label) + 'の回を動かします。作ると運営LINEにURLが流れます。</p>' +
      people.map(function (m) { return '<button data-reqby="' + esc(m.key) + '" data-date="' + esc(date) + '" style="background:' + (m.key === SER.owner.key ? 'var(--navy)' : color(m.key)) + '">' + esc(m.name) + '</button>'; }).join('') +
      '<button class="later" data-reqby="">やめる</button></div></div>';
  }
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('[data-req]'); if (!b) return;
    askRequester(b.dataset.req);
  });
  document.getElementById('modalRoot').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-reqby]'); if (!b) return;
    var root = document.getElementById('modalRoot');
    if (!b.dataset.reqby) { root.innerHTML = ''; return; }
    b.disabled = true; b.textContent = '作っています…';
    call('meetPollRequest', { date: b.dataset.date, by: b.dataset.reqby }).then(function (r) {
      location.href = '?p=' + encodeURIComponent(r.id);
    }).catch(function (e) { alert(errText(e)); root.innerHTML = ''; });
  });

  load();
})();
</script>
</body>
</html>
