<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メニュー相談 | YORON BBQ</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d95f3b'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* メニュー相談（2026-09-28 山根さん）: menu.html の料理から、やまちゃんとうえたくが「やりたい」を付け合う。
   データは買い物チェックと同じ shoplists/{l}。「やりたい」が付いた料理は買い物リストの料理にもそのまま入る */
:root{--bg:#f6f1e4;--card:#fffdf6;--ink:#2d251c;--ink-soft:#8a8177;--ink2:#5b5044;--line:rgba(45,37,28,.14);--ember:#d95f3b;--ember-deep:#b74a2c;--navy:#2b3a4a;--sand:#efe8d6;--ok:#3d7a4a;--ok-bg:#e9f3ea}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 110px}
.logo{font-weight:900;letter-spacing:.08em;color:var(--ember-deep);font-size:.95rem}
.logo small{font-size:.62rem;color:var(--ink-soft);letter-spacing:.18em;margin-left:.4em}
h1{font-size:1.5rem;font-weight:900;margin:10px 0 4px;line-height:1.35}
.lead{color:var(--ink2);font-size:.9rem}
.k{font-size:.7rem;letter-spacing:.2em;color:var(--ember-deep);font-weight:900;margin:22px 0 8px}
.me{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border-radius:14px;padding:10px 12px;margin-top:14px;font-size:.85rem;font-weight:700}
.chip{padding:.45rem .95rem;border-radius:100px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-weight:900;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}}
.d{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.d.want{border-color:var(--ember)}
.d.fixed{border-color:var(--ok)}
.d img,.d .ph{width:100%;height:96px;object-fit:cover;background:var(--sand);display:block}
.d .in{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.d b{font-size:.86rem;font-weight:900;line-height:1.4}
.d p{font-size:.72rem;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
	.badge{display:inline-block;font-size:.66rem;font-weight:900;border-radius:100px;padding:1px 9px;background:var(--ok-bg);color:var(--ok);align-self:flex-start}
	.who{display:flex;flex-direction:column;gap:3px;min-height:42px;margin:2px 0}
	.who span{font-size:.68rem;font-weight:900;border-radius:8px;padding:2px 7px;background:var(--sand);color:var(--ink2)}
	.who span.on{background:rgba(217,95,59,.14);color:var(--ember-deep)}
	.btn{margin-top:auto;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:.58rem .72rem;font:inherit;font-weight:900;font-size:.82rem;cursor:pointer;color:var(--ink2);min-height:44px}
	.btn.on{background:var(--ember);border-color:var(--ember);color:#fff}
	.btn:disabled{opacity:.5}
	.btn .sub{display:block;font-size:.64rem;font-weight:800;line-height:1.3;opacity:.82}
	.recipe{font-size:.72rem;color:var(--ember-deep);font-weight:700;text-decoration:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(246,241,228,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.bar .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
.bar .sum{font-size:.8rem;font-weight:700;color:var(--ink2);flex:1;line-height:1.4}
.bar a{background:var(--ember);color:#fff;text-decoration:none;font-weight:900;font-size:.85rem;padding:.6rem 1rem;border-radius:100px;white-space:nowrap}
.cm{display:flex;flex-direction:column;gap:3px}
.cm div{font-size:.72rem;line-height:1.5;background:var(--sand);border-radius:8px;padding:3px 7px}
.cm div b{font-size:.68rem;font-weight:900;color:var(--ember-deep);margin-right:4px;display:inline}
.cmb{border:0;background:none;font:inherit;font-size:.72rem;font-weight:800;color:var(--ink-soft);text-align:left;padding:0;cursor:pointer}
.cmf{display:flex;gap:4px}.cmf input{flex:1;min-width:0;font:inherit;font-size:.8rem;border:1.5px solid var(--line);border-radius:8px;padding:.3rem .5rem}
.cmf button{border:0;background:var(--ink);color:#fff;border-radius:8px;font:inherit;font-size:.75rem;font-weight:900;padding:0 .6rem;cursor:pointer}
.talk{background:var(--card);border-radius:14px;padding:12px;margin-top:12px}
.talk h2{font-size:.95rem;font-weight:900;margin-bottom:6px}
.talk .cm div{font-size:.84rem;padding:6px 10px}.talk .cm div b{font-size:.74rem}
.talk .cmf{margin-top:8px}.talk .cmf input{font-size:.9rem;padding:.5rem .7rem}
.summary{background:var(--card);border:2px solid rgba(217,95,59,.24);border-radius:14px;padding:12px;margin-top:12px;scroll-margin-top:14px}
.summary h2{font-size:.98rem;font-weight:900;margin-bottom:6px}
.summary .save{font-size:.74rem;font-weight:900;color:var(--ink-soft);margin-bottom:8px;min-height:1.4em}
.summary .save.ok{color:var(--ok)}.summary .save.err{color:var(--ember-deep)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks span{font-size:.75rem;font-weight:900;background:rgba(217,95,59,.12);color:var(--ember-deep);border-radius:100px;padding:3px 9px}
.statusGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.person{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff}
.person b{display:block;font-size:.72rem;color:var(--ink-soft);margin-bottom:2px}
.person span{font-size:.78rem;font-weight:900;color:var(--ink2)}
.msg{margin-top:30px;text-align:center;color:var(--ink2)}
.hint{font-size:.74rem;color:var(--ink-soft);margin-top:6px}
.sh{font-size:1.05rem;font-weight:900;margin-bottom:8px}
.sh small{font-size:.78rem;font-weight:800;color:var(--ink-soft);margin-left:.4em}
.empty{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:.82rem;color:var(--ink2);text-align:center}
.d.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px rgba(217,95,59,.55)}100%{box-shadow:0 0 0 0 rgba(217,95,59,0)}}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:#fff;font-size:.82rem;font-weight:700;line-height:1.5;padding:.6rem 1rem;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:20}
.toast[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">YORON BBQ<small>MENU</small></div>
  <div id="app"><p class="msg">読み込み中…</p></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="bar" id="bar" hidden><div class="in"><span class="sum" id="sum"></span><a id="toShop" href="#">② 買い物リストへ</a></div></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="bbq-steps.js"></script>
<script src="menu-pick-logic.js"></script>
<script>
(async function(){
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const app=document.getElementById('app');
  const id=new URLSearchParams(location.search).get('l')||'';
  if(!/^[a-z0-9]{6,30}$/.test(id)){ app.innerHTML='<p class="msg">URLをご確認ください。</p>'; return; }
  const R=await (await fetch('data/recipes.json?v='+Date.now())).json();
  await sfAuth.signInAnonymously().catch(()=>{});
  const ref=db.collection('shoplists').doc(id);
  const PEOPLE=['やまちゃん','うえたく'];
  const meKey='yoron_me_'+id; let me=''; try{ me=localStorage.getItem(meKey)||''; }catch(e){}
  let data=null, busy=false, saveState={ text:'', kind:'' };
  document.getElementById('toShop').href='shopping.html?l='+id;

  let toastTimer=0, flashName='';
  function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ el.hidden=true; },2600); }
  const eventKey=()=>String(data?.menuPickEventId||data?.eventId||String(data?.title||'').match(/\d{8}/)?.[0]||id);
  const cleanList=a=>Array.isArray(a)?[...new Set(a.map(x=>String(x||'').trim()).filter(Boolean))]:[];
  function wantsFor(src){
    const key=eventKey();
    const byEvent=src?.wantsByEvent&&typeof src.wantsByEvent==='object'?src.wantsByEvent[key]:null;
    const raw=byEvent&&typeof byEvent==='object'?byEvent:(src?.menuPickEventId===key?(src?.wants||{}):{});
    return Object.fromEntries(PEOPLE.map(p=>[p, cleanList(raw[p])]));
  }
  function legacyWantsFor(src){
    const key=eventKey();
    const byEvent=src?.wantsByEvent&&typeof src.wantsByEvent==='object'?src.wantsByEvent[key]:null;
    if(byEvent||src?.menuPickEventId) return {};
    const legacy=Object.fromEntries(PEOPLE.map(p=>[p, cleanList(src?.wants?.[p])]));
    return Object.values(legacy).some(a=>a.length)?legacy:{};
  }
  function putWants(target,wants){
    const key=eventKey();
    const current=Object.fromEntries(PEOPLE.map(p=>[p, cleanList(wants[p])]));
    target.wantsByEvent=Object.assign({},target.wantsByEvent||{}, { [key]: current });
    target.menuPickEventId=key;
  }
  const wantsAnyone=(wants,name)=>PEOPLE.some(p=>(wants[p]||[]).includes(name));
  const scrollSummary=()=>setTimeout(()=>document.getElementById('summary')?.scrollIntoView({ behavior:'smooth', block:'start' }),0);

  async function toggle(name){
    if(!me||busy) return; busy=true;
    const before=JSON.parse(JSON.stringify(data||{}));
    const optimistic=JSON.parse(JSON.stringify(data||{}));
    const wants=wantsFor(optimistic);
    const mine=new Set(wants[me]||[]);
    const on=!mine.has(name); on?mine.add(name):mine.delete(name);
    wants[me]=[...mine];
    putWants(optimistic,wants);
    saveState={ text:'保存中…', kind:'' };
    flashName=name;
    data=optimistic; render(); scrollSummary();
    try{
      await db.runTransaction(async tx=>{
        const cur=(await tx.get(ref)).data()||{};
        const key=eventKey();
        const wants=wantsFor(cur);
        const mine=new Set(wants[me]||[]);
        const on=!mine.has(name); on?mine.add(name):mine.delete(name);
        wants[me]=[...mine];
        const fixed=Object.keys(cur.menuFixed||{});
        let dishes=[...(cur.dishes||[])];
        const anyone=wantsAnyone(wants,name);
        if(on && !dishes.includes(name)) dishes.push(name);
        // 最後の「やりたい」が外れたら買い物リストからも外す（確定の料理は外さない）
        if(!on && !anyone && !fixed.includes(name)) dishes=dishes.filter(x=>x!==name);
        tx.update(ref,
          new firebase.firestore.FieldPath('wantsByEvent', key, me), cleanList(wants[me]),
          'menuPickEventId', key,
          'dishes', dishes,
          'title', cur.title||'',
          'updatedAt', new Date().toISOString()
        );
      });
      saveState={ text:'保存しました', kind:'ok' }; render(); scrollSummary();
      toast(on?`「${name}」を上の確認欄へ反映しました（買い物リストにも入ります）`:`「${name}」を今回の「やりたい」から外しました`);
    }catch(e){
      data=before;
      saveState={ text:'保存に失敗しました。通信を確認してもう一度押してください。', kind:'err' };
      render(); scrollSummary();
    }
    busy=false;
  }

  const ALL='__all';
  async function addComment(name, text){
    text=String(text||'').trim().slice(0,200); if(!me||!text) return;
    try{
      await db.runTransaction(async tx=>{
        const cur=(await tx.get(ref)).data()||{};
        const comments=Object.assign({},cur.comments||{});
        comments[name]=[...(comments[name]||[]), { by:me, text, at:new Date().toISOString() }].slice(-30);
        tx.update(ref,{ comments, title:cur.title||'', updatedAt:new Date().toISOString() });
      });
    }catch(e){ alert('コメントを保存できませんでした。'); }
  }
  const cmList=name=>((data.comments||{})[name]||[]).map(c=>`<div><b>${esc(c.by)}</b>${esc(c.text)}</div>`).join('');
  const cmForm=(name,ph)=>me?`<form class="cmf" data-cm="${esc(name)}"><input maxlength="200" placeholder="${esc(ph)}"><button>送る</button></form>`:'';
  const openCm=new Set();
  function personLine(person,on,mine){
    const label=mine?'自分':'相手';
    return `<span class="${on?'on':''}">${esc(label)}：${esc(person)}｜${on?'✓ やりたいを選択済み':'未選択'}</span>`;
  }
  function card(d, st){
    const img=d.img?`<img src="${esc(d.img)}" alt="" loading="lazy">`:'<div class="ph" style="display:grid;place-items:center;font-size:.7rem;color:var(--ink-soft);font-weight:800">写真はこれから</div>';
    const who=PEOPLE.map(n=>personLine(n,st.who.includes(n),me===n)).join('');
    const fixedNote=st.fixed!==undefined?`<span class="badge">確定${st.fixed?'｜'+esc(st.fixed):''}</span>`:'';
    const btn=st.fixed!==undefined?'':`<button class="btn${st.mine?' on':''}" data-n="${esc(d.name)}" aria-pressed="${st.mine?'true':'false'}" ${me?'':'disabled'}>${st.mine?'✓ やりたいを選択済み':'未選択：やりたいにする'}<span class="sub">${st.mine?'もう一度押すと解除':'押すと上の確認欄へ反映'}</span></button>`;
    return `<div class="d${st.fixed!==undefined?' fixed':st.who.length?' want':''}${flashName===d.name?' flash':''}" data-card="${esc(d.name)}">${img}<div class="in">${fixedNote}<b>${esc(d.name)}</b><p>${esc(d.tagline||'')}</p><div class="who">${who}</div><a class="recipe" href="menu.html?d=${encodeURIComponent(d.name)}" target="_blank" rel="noopener">作り方を見る</a><div class="cm">${cmList(d.name)}</div>${openCm.has(d.name)?cmForm(d.name,'ひとこと'):(me?`<button class="cmb" data-open="${esc(d.name)}">＋ コメント</button>`:'')}${btn}</div></div>`;
  }

  function render(){
    // 相手の更新で画面を描き直しても、入力中のコメントは消さない
    const drafts={}; let focused=null;
    app.querySelectorAll('form[data-cm] input').forEach(i=>{ const k=i.closest('form').dataset.cm; drafts[k]=i.value; if(document.activeElement===i) focused=k; });
    draw();
    app.querySelectorAll('form[data-cm] input').forEach(i=>{ const k=i.closest('form').dataset.cm; if(drafts[k]) i.value=drafts[k]; if(focused===k){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } });
  }
  function draw(){
    const fixed=data.menuFixed||{}, wants=wantsFor(data);
    const viewData=Object.assign({}, data, { wants });
    const G=MenuPick.group(R.dishes, viewData, PEOPLE, me), st=G.st, C=G.counts;
    const grid=list=>`<div class="grid">${list.map(d=>card(d,st(d.name))).join('')}</div>`;
    const mine=me?G.wanted.filter(d=>st(d.name).mine):[];
    const other=me?PEOPLE.find(p=>p!==me):'';
    const theirs=other?G.wanted.filter(d=>st(d.name).who.includes(other)):G.wanted;
    const picks=list=>list.length?`<div class="picks">${list.map(d=>`<span>${esc(d.name)}</span>`).join('')}</div>`:'<p class="hint" style="margin:0">まだありません。</p>';
    const legacy=legacyWantsFor(data);
    const legacyNames=[...new Set(PEOPLE.flatMap(p=>legacy[p]||[]))];
    const legacyNote=legacyNames.length?`
        <p class="hint">以前の保存データがありますが、この回の選択か確認できないため、今回の「やりたい」には数えていません。</p>
        <div class="picks">${legacyNames.map(n=>`<span>出所未確認：${esc(n)}</span>`).join('')}</div>`:'';
    const summary=`
      <section class="summary" id="summary" tabindex="-1" aria-live="polite">
        <h2>今回の確認</h2>
        <div class="save ${esc(saveState.kind)}">${esc(saveState.text||'選ぶとすぐここに反映されます。')}</div>
        <div class="statusGrid">
          <div class="person"><b>${me?'自分':'自分'}</b><span>${me?esc(me)+'｜'+mine.length+'品':'先に自分を選んでください'}</span></div>
          <div class="person"><b>相手</b><span>${me?esc(other||'相手')+'｜'+theirs.length+'品':'未選択'}</span></div>
        </div>
        <p class="hint">選択済みは「✓ やりたいを選択済み」と表示されます。解除は同じボタンをもう一度押します。</p>
        ${picks(me?mine:G.wanted)}
        ${legacyNote}
      </section>`;
    document.title=BbqSteps.dateTitle(data.title)+' のメニュー相談 | YORON BBQ';
    app.innerHTML=`
      <h1>${esc(BbqSteps.dateTitle(data.title))} のメニュー相談</h1>
      ${BbqSteps.html(id,'menu')}
      <p class="lead">上から「確定」「やりたい」「選択肢」の順です。選択肢で「やりたい」を押すと、誰がやりたいかが付いて「やりたい」に入り、買い物リストにもその場で入ります。もう一度押すと選択肢に戻ります。</p>
      <div class="me">あなたは：${PEOPLE.map(p=>`<button class="chip${me===p?' on':''}" data-me="${esc(p)}">${esc(p)}</button>`).join('')}${me?'':'<span class="hint" style="margin:0">← 先に選んでください</span>'}</div>
      ${summary}
      <div class="talk"><h2>ひとこと（全体）</h2><div class="cm">${cmList(ALL)||'<p class="hint" style="margin:0">量や段取りの相談はここに。</p>'}</div>${cmForm(ALL,'例：ご飯は大変そうだから今回は見送り？')}</div>
      ${G.fixed.length?`<p class="k">FIXED</p><h2 class="sh">確定（毎回これはやる）<small>${C.fixed}品</small></h2>${grid(G.fixed)}`:''}
      <p class="k">WANT</p><h2 class="sh">やりたい<small>${C.want}品（2人とも${C.both}品）</small></h2>
      <p class="hint" style="margin:-4px 0 8px">誰がやりたいかを札に出しています。自分の「やりたい ✓」をもう一度押すと下の選択肢に戻ります。</p>
      ${G.wanted.length?grid(G.wanted):'<div class="empty">まだありません。下の選択肢で「やりたい」を押すと、ここに入ります。</div>'}
      <p class="k">OPTIONS</p><h2 class="sh">選択肢<small>${G.options.length}品</small></h2>
      ${G.options.length?grid(G.options):'<div class="empty">全部の料理に「やりたい」が付いています。</div>'}`;
    app.querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>{ me=b.dataset.me; try{localStorage.setItem(meKey,me);}catch(e){} render(); });
    app.querySelectorAll('.btn[data-n]').forEach(b=>b.onclick=()=>toggle(b.dataset.n));
    app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ openCm.add(b.dataset.open); render(); const i=app.querySelector(`form[data-cm="${CSS.escape(b.dataset.open)}"] input`); if(i) i.focus(); });
    app.querySelectorAll('form[data-cm]').forEach(f=>f.onsubmit=async e=>{ e.preventDefault(); const i=f.querySelector('input'); const v=i.value; if(!v.trim()) return; i.value=''; await addComment(f.dataset.cm, v); if(f.dataset.cm!==ALL) openCm.delete(f.dataset.cm); });
    document.getElementById('sum').textContent=`確定${C.fixed}品＋やりたい${C.want}品${me?`（${me} ${C.mine}品）`:''}｜買い物リストに${C.shop}品`;
    flashName='';
    document.getElementById('bar').hidden=false;
  }

  ref.onSnapshot(s=>{ if(!s.exists){ app.innerHTML='<p class="msg">この回のメニュー相談が見つかりませんでした。</p>'; return; } data=s.data(); render(); },
    ()=>{ app.innerHTML='<p class="msg">読み込めませんでした。</p>'; });
})();
</script>
</body>
</html>
