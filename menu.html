<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今回のメニュー｜作り方と美味しい理由 | YORON BBQ</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d95f3b'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f1e4;--card:#fffdf6;--ink:#2d251c;--ink-soft:#8a8177;--line:rgba(45,37,28,.14);--ember:#d95f3b;--ember-deep:#b74a2c;--navy:#2b3a4a;--sand:#efe8d6}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
    a{color:inherit}
    .wrap{max-width:760px;margin:0 auto;padding:18px 16px 96px}
    header .logo{display:inline-flex;align-items:baseline;gap:8px;text-decoration:none;font-weight:900;letter-spacing:.08em;color:var(--ember-deep)}
    header .logo small{font-size:.7rem;color:var(--ink-soft);letter-spacing:.14em}
    h1{font-size:1.75rem;font-weight:900;margin:12px 0 4px;line-height:1.25}
    .lead{color:var(--ink-soft);font-size:.9rem}
    .hero{margin:14px -16px 0;height:170px;background:url(images/gallery-2.jpg) center/cover;position:relative}
    .hero span{position:absolute;left:16px;bottom:12px;background:rgba(255,253,246,.92);padding:6px 12px;border-radius:100px;font-size:.78rem;font-weight:800}
    .k{font-size:.72rem;letter-spacing:.18em;color:var(--ember-deep);font-weight:900;margin:22px 0 8px}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{padding:.5rem .9rem;border-radius:100px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:.85rem;cursor:pointer}
    .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
    .toc{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .toc a{font-size:.78rem;padding:.3rem .7rem;border-radius:100px;background:var(--sand);text-decoration:none;font-weight:700}
    .dish{background:var(--card);border:1.5px solid var(--line);border-radius:20px;margin-top:14px;overflow:hidden}
    .dish .img{height:190px;background:var(--sand) center/cover}
    .dish .head{padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
    .dish .head h2{font-size:1.2rem;font-weight:900;line-height:1.3}
    .dish .head p{font-size:.82rem;color:var(--ink-soft)}
    .dish .head .more{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-weight:900;color:var(--ember-deep);transition:transform .25s}
    .dish.open .head .more{transform:rotate(45deg)}
    .specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 14px}
    .spec{background:var(--navy);color:#fff;border-radius:14px;padding:10px 8px;text-align:center}
    .spec small{display:block;font-size:.62rem;letter-spacing:.14em;opacity:.75;margin-bottom:2px}
    .spec b{font-size:1.05rem;font-weight:900;line-height:1.2}
    .spec.sign b{font-size:.82rem;font-weight:800}
    .body{display:none;padding:0 16px 18px;border-top:1px dashed var(--line)}
    .dish.open .body{display:block}
    .sec{margin-top:16px}
    .sec h3{font-size:.72rem;letter-spacing:.18em;color:var(--ember-deep);font-weight:900;margin-bottom:6px}
    .tags{display:flex;flex-wrap:wrap;gap:6px}
    .tag{background:var(--sand);border-radius:8px;padding:.3rem .6rem;font-size:.85rem;font-weight:700}
    .tag.buy{background:#fff;border:1.5px solid var(--line)}
    ol{padding-left:0;list-style:none;counter-reset:s}
    ol li{position:relative;padding-left:2.1rem;margin:.55rem 0;font-size:.95rem}
    ol li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:.15rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--ember);color:#fff;font-size:.78rem;font-weight:900;display:grid;place-items:center}
    .why{background:var(--sand);border-radius:14px;padding:12px 14px;margin-top:8px}
    .why b{display:block;font-size:.95rem}
    .why p{font-size:.88rem;margin-top:2px}
    .why small{display:block;color:var(--ink-soft);font-size:.72rem;margin-top:4px}
    .why small a{color:var(--ember-deep)}
    .gear-note{font-size:.8rem;color:var(--ink-soft);margin-top:4px}
    .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,246,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
    .bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.85rem}
    .bar button{border:0;background:var(--ink);color:#fff;font-weight:800;font-size:.82rem;padding:.55rem 1rem;border-radius:100px;cursor:pointer}
    .foot{margin-top:28px;font-size:.75rem;color:var(--ink-soft)}
    @media (min-width:700px){.dish .img{height:260px}.hero{height:240px}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="index.html">YORON BBQ<small>TODAY'S MENU</small></a>
    <h1 id="title">今回のメニュー</h1>
    <p class="lead">「これどうやって作ってるの？」に答えるページ。料理をタップすると、材料・道具・買う場所・焼き方・美味しい理由が開きます。</p>
  </header>
  <div class="hero"><span id="heroLabel">YORON BBQ</span></div>
  <p class="k">メニューを切り替える</p>
  <div class="chips" id="presets"></div>
  <div class="toc" id="toc"></div>
  <div id="list"></div>
  <p class="foot" id="foot"></p>
</div>
<div class="bar"><div class="in"><span id="cnt"></span><button id="share">このメニューのURLをコピー</button></div></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(async function(){
  const [R, S] = await Promise.all([
    fetch('data/recipes.json?v='+Date.now()).then(r=>r.json()),
    fetch('data/shopping-items.json?v='+Date.now()).then(r=>r.json()).catch(()=>({presets:{}}))
  ]);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const presets = Object.assign({}, S.templates||S.presets||{});
  const q = new URLSearchParams(location.search);
  const ALL='ぜんぶ（レパートリー）';
  // 買い物チェック（shopping.html?l=ID）と同じIDで、その回の料理を表示
  let eventTitle=null;
  if(q.get('l')){ try{ const snap=await firebase.firestore().collection('shoplists').doc(q.get('l')).get(); if(snap.exists){ const d=snap.data(); eventTitle=d.title; presets['__event']=d.dishes||[]; } }catch(e){} }
  if(q.get('d')) presets.__custom = q.get('d').split(',');
  const names = Object.keys(presets).filter(n=>!n.startsWith('__'));
  let cur = eventTitle ? '__event' : (q.get('event') && presets[q.get('event')] ? q.get('event') : (q.get('d') ? '__custom' : (names[0] || ALL)));
  const P=document.getElementById('presets');
  if(eventTitle){ const c=document.createElement('button'); c.className='chip'; c.textContent=eventTitle; c.dataset.n='__event'; c.onclick=()=>{cur='__event'; render();}; P.appendChild(c); }
  [...names, ALL].forEach(n=>{ const c=document.createElement('button'); c.className='chip'; c.textContent=n; c.dataset.n=n; c.onclick=()=>{cur=n; const u=new URL(location); u.searchParams.delete('d'); n===ALL?u.searchParams.delete('event'):u.searchParams.set('event',n); history.replaceState(null,'',u); render();}; P.appendChild(c); });
  function render(){
    document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.n===cur));
    const sel = cur===ALL ? R.dishes.map(d=>d.name) : (presets[cur]||[]);
    const dishes = R.dishes.filter(d=>sel.includes(d.name)).sort((a,b)=>sel.indexOf(a.name)-sel.indexOf(b.name));
    const label = cur==='__event' ? eventTitle : cur==='__custom' ? '選んだ料理' : cur;
    document.getElementById('title').textContent = cur===ALL ? 'YORON BBQ のレパートリー' : (cur==='__event' ? '今回のメニュー' : label);
    document.getElementById('heroLabel').textContent = cur===ALL ? `全${dishes.length}品` : `${label.replace(/^\d{8}\s*/,'')}　${dishes.length}品`;
    document.getElementById('cnt').textContent = `${dishes.length}品`;
    document.getElementById('toc').innerHTML = dishes.map((d,i)=>`<a href="#d${i}">${esc(d.name)}</a>`).join('');
    const L=document.getElementById('list');
    L.innerHTML = dishes.map((d,i)=>`
      <article class="dish" id="d${i}">
        ${d.img?`<div class="img" style="background-image:url('${esc(d.img)}')"></div>`:''}
        <div class="head" data-i="${i}"><div><h2>${esc(d.name)}</h2><p>${esc(d.tagline||'')}</p></div><div class="more">＋</div></div>
        <div class="specs"><div class="spec"><small>グリル</small><b>${esc(d.spec.grill)}</b></div><div class="spec"><small>時間</small><b>${esc(d.spec.time)}</b></div><div class="spec sign"><small>出す合図</small><b>${esc(d.spec.sign)}</b></div></div>
        <div class="body">
          <div class="sec"><h3>材料</h3><div class="tags">${d.ingredients.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div>
          <div class="sec"><h3>下味・調味料</h3><div class="tags">${d.seasoning.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div>
          <div class="sec"><h3>使う道具</h3><div class="tags">${d.gear.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>${d.gear.filter(g=>R.gear_notes[g]).map(g=>`<p class="gear-note">${esc(g)}：${esc(R.gear_notes[g])}</p>`).join('')}</div>
          <div class="sec"><h3>買う場所</h3><div class="tags">${d.buy.map(x=>`<span class="tag buy">${esc(x)}</span>`).join('')}</div></div>
          <div class="sec"><h3>焼き方</h3><ol>${d.how.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
          ${d.why.length?`<div class="sec"><h3>美味しい理由</h3>${d.why.map(w=>`<div class="why"><b>${esc(w.title)}</b><p>${esc(w.text)}</p><small>出典：${w.url?`<a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.source)}</a>`:esc(w.source)}</small></div>`).join('')}</div>`:''}
        </div>
      </article>`).join('');
    L.querySelectorAll('.head').forEach(h=>h.onclick=()=>h.closest('.dish').classList.toggle('open'));
    if(dishes.length===1) L.querySelector('.dish').classList.add('open');
    document.getElementById('foot').textContent = `更新 ${R.updated}。${R.why_note||''}`;
  }
  document.getElementById('share').onclick=async()=>{ const u=location.href; try{await navigator.clipboard.writeText(u);}catch(e){} const b=document.getElementById('share'); b.textContent='コピーしました'; setTimeout(()=>b.textContent='このメニューのURLをコピー',1500); };
  render();
  if(location.hash){ const el=document.querySelector(location.hash); if(el){el.classList.add('open'); el.scrollIntoView();} }
})();
</script>
</body>
</html>
